<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create event — Göle</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 300px; width: 100%; margin-top: 8px; }
        #meeting_point_row { display: flex; gap: 8px; }
        #meeting_point_row input { flex: 1; }
    </style>
</head>
<body>
    <a href="/">← Back to events</a>
    <h1>Create a new event</h1>

    <form action="/events/new" method="post">
        <p>
            <label>Sport:
                <select name="sport" required>
                    <option value="bike">Bike</option>
                    <option value="motorcycle">Motorcycle</option>
                    <option value="run">Run</option>
                </select>
            </label>
        </p>
        <p>
            <label>Title:
                <input type="text" name="title" required>
            </label>
        </p>
        <p>
            <label>Date and time:
                <input type="datetime-local" name="date" required>
            </label>
        </p>

        <p>
            <label>Meeting point — type and press Enter to search, or click the map</label>
            <span id="meeting_point_row">
                <input type="text" name="meeting_point" id="meeting_point" required>
                <button type="button" id="search_btn">Search</button>
            </span>
        </p>
        <div id="map"></div>

        <!-- Written by JS when the user picks a location; submitted with the form. -->
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">

        <p>
            <label>Pace:
                <input type="text" name="pace" placeholder="e.g. relaxed, moderate, fast" required>
            </label>
        </p>
        <p>
            <label>Max participants (optional):
                <input type="number" name="max_participants" min="1">
            </label>
        </p>
        <p>
            <label>Route link — Komoot/Strava (optional):
                <input type="url" name="route_link">
            </label>
        </p>
        <p>
            <label>Description (optional):<br>
                <textarea name="description" rows="4" cols="40"></textarea>
            </label>
        </p>
        <button type="submit">Create event</button>
    </form>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([48.1374, 11.5755], 12);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let marker = null;

        function setPin(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
            }
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
        }

        // Forward geocode: place name → coordinates.
        function search() {
            const query = document.getElementById('meeting_point').value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`)
                .then(r => r.json())
                .then(results => {
                    if (results.length === 0) {
                        alert('No results found. Try a more specific search.');
                        return;
                    }
                    const place = results[0];
                    const lat = parseFloat(place.lat);
                    const lng = parseFloat(place.lon);
                    setPin(lat, lng);
                    map.setView([lat, lng], 14);
                });
        }

        document.getElementById('search_btn').addEventListener('click', search);

        document.getElementById('meeting_point').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();  // don't submit the form
                search();
            }
        });

        // Clicking the map places the pin and reverse geocodes to fill the meeting point field.
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            setPin(lat, lng);

            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
                .then(r => r.json())
                .then(result => {
                    if (result && result.display_name) {
                        document.getElementById('meeting_point').value = result.display_name;
                    }
                });
        });
    </script>
</body>
</html>
