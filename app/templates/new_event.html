<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create event — RideMeet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 300px; width: 100%; margin-top: 8px; }

        #meeting_point_wrapper { position: relative; }
        #meeting_point { width: 100%; box-sizing: border-box; }

        #autocomplete {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            list-style: none;
            margin: 0;
            padding: 0;
            z-index: 1000;
        }
        #autocomplete li {
            padding: 8px;
            cursor: pointer;
            font-size: 0.9em;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #autocomplete li:hover { background: #f0f0f0; }
        #autocomplete:empty { display: none; }
    </style>
</head>
<body>
    <a href="/">← Back to events</a>
    <h1>Create a new event</h1>

    <form action="/events/new" method="post">
        <p>
            <label>Sport:
                <select name="sport" required>
                    <option value="bike">Bike</option>
                    <option value="motorcycle">Motorcycle</option>
                    <option value="run">Run</option>
                </select>
            </label>
        </p>
        <p>
            <label>Title:
                <input type="text" name="title" required>
            </label>
        </p>
        <p>
            <label>Date and time:
                <input type="datetime-local" name="date" required>
            </label>
        </p>

        <p>
            <label>Meeting point</label>
            <div id="meeting_point_wrapper">
                <input type="text" name="meeting_point" id="meeting_point"
                       placeholder="Type to search, or click the map" required autocomplete="off">
                <!-- Autocomplete suggestions are injected here by JS. -->
                <ul id="autocomplete"></ul>
            </div>
        </p>
        <div id="map"></div>

        <!-- Written by JS when the user picks a location; submitted with the form. -->
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">

        <p>
            <label>Pace:
                <input type="text" name="pace" placeholder="e.g. relaxed, moderate, fast" required>
            </label>
        </p>
        <p>
            <label>Max participants (optional):
                <input type="number" name="max_participants" min="1">
            </label>
        </p>
        <p>
            <label>Route link — Komoot/Strava (optional):
                <input type="url" name="route_link">
            </label>
        </p>
        <p>
            <label>Description (optional):<br>
                <textarea name="description" rows="4" cols="40"></textarea>
            </label>
        </p>
        <button type="submit">Create event</button>
    </form>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([48.1374, 11.5755], 12);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let marker = null;
        const input = document.getElementById('meeting_point');
        const autocompleteList = document.getElementById('autocomplete');

        function setPin(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
            }
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
        }

        function clearSuggestions() {
            autocompleteList.innerHTML = '';
        }

        function selectSuggestion(place) {
            input.value = place.display_name;
            clearSuggestions();
            const lat = parseFloat(place.lat);
            const lng = parseFloat(place.lon);
            setPin(lat, lng);
            map.setView([lat, lng], 14);
        }

        function showSuggestions(results) {
            clearSuggestions();
            results.forEach(place => {
                const li = document.createElement('li');
                li.textContent = place.display_name;
                // mousedown fires before the input's blur event, so the click
                // registers before the list disappears.
                li.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    selectSuggestion(place);
                });
                autocompleteList.appendChild(li);
            });
        }

        // Debounce: wait 300ms after the user stops typing before fetching.
        // Without this we'd fire a request on every single keystroke.
        let debounceTimer = null;
        input.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = input.value.trim();
            if (query.length < 3) {
                clearSuggestions();
                return;
            }
            debounceTimer = setTimeout(function() {
                fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5`)
                    .then(r => r.json())
                    .then(showSuggestions);
            }, 300);
        });

        // Hide suggestions when the input loses focus.
        input.addEventListener('blur', clearSuggestions);

        // Enter key: pick the first suggestion if any, otherwise do nothing.
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const first = autocompleteList.querySelector('li');
                if (first) first.dispatchEvent(new MouseEvent('mousedown'));
            }
            if (e.key === 'Escape') {
                clearSuggestions();
            }
        });

        // Clicking the map places the pin and reverse geocodes to fill the field.
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            setPin(lat, lng);
            clearSuggestions();

            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
                .then(r => r.json())
                .then(result => {
                    if (result && result.display_name) {
                        input.value = result.display_name;
                    }
                });
        });
    </script>
</body>
</html>
